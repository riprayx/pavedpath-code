interface:
  display_name: "PavedPath Code"
  alias: "PavedPath Code (Code Edition)"
  short_description: "Find proven engineering solutions in GitHub evidence and adapt them into minimal, verifiable local changes."
  default_prompt: "Use $pavedpath-code to frame my software engineering problem, search GitHub and open-source evidence with gh first, conditionally use subagents only when they improve research coverage, list relevant project basics including Stars when a repository-level solution applies, record subagent trace if used, then recommend the smallest local adaptation and verification path."
